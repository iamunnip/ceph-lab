# The lab VMs and their groups.
#
# ansible_host is the VM's address on the host-only network 192.168.56.0/24.
# Ansible connects to it, and Ceph uses the same address. Never use the
# NAT address 10.0.2.15, which is the same on every VM.
#
# vagrant_machine is the VM's name in the Vagrantfile. It picks the VM's SSH
# key in group_vars/all.yml. It must be a host setting: with "delegate_to",
# inventory_hostname keeps the name of the original host, so a key path built
# from it uses the wrong VM's key (seen on 2026-11-09).
#
# A host gets a Ceph label by being in a group. The label names are mapped
# to these groups in group_vars/ceph.yml (ceph_host_labels).

all:
  children:
    # The three storage VMs. Every play in site.yml runs on these.
    ceph:
      hosts:
        node-01:
          ansible_host: 192.168.56.11
          vagrant_machine: node-01
        node-02:
          ansible_host: 192.168.56.12
          vagrant_machine: node-02
        node-03:
          ansible_host: 192.168.56.13
          vagrant_machine: node-03

    # The VM that bootstraps the cluster and runs the Ceph commands. Exactly one host.
    ceph_bootstrap:
      hosts:
        node-01:

    # Administration hosts: they get cephadm, the Ceph configuration and the
    # admin keyring (Ceph label _admin).
    ceph_admin:
      hosts:
        node-01:
        node-02:

    # Monitors (Ceph label mon).
    ceph_mon:
      hosts:
        node-01:
        node-02:
        node-03:

    # Managers (Ceph label mgr).
    ceph_mgr:
      hosts:
        node-01:
        node-02:
        node-03:

    # Hosts whose data disk becomes an OSD (Ceph label osd).
    ceph_osd:
      hosts:
        node-01:
        node-02:
        node-03:

    # Prometheus, Alertmanager and Grafana (Ceph label monitoring).
    ceph_monitoring:
      hosts:
        node-02:

    # HTTPS gateway in front of the dashboard (Ceph label gateway).
    ceph_gateway:
      hosts:
        node-01:
        node-02:
        node-03:

    # Optional client VMs. No play runs on them yet. They are listed so every
    # storage VM can resolve their names in /etc/hosts.
    clients:
      hosts:
        node-04:
          ansible_host: 192.168.56.14
          vagrant_machine: node-04
        node-05:
          ansible_host: 192.168.56.15
          vagrant_machine: node-05
