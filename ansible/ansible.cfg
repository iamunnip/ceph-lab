# Ansible reads this file when you run Ansible from this folder (ansible/).

[defaults]
# The list of VMs and their groups.
inventory = inventory/hosts.yml

# Where the roles live.
roles_path = roles

# Find Python on the VMs without printing a warning about it.
interpreter_python = auto_silent

# Print task results as readable YAML instead of one long JSON line.
callback_result_format = yaml

# Wait up to 30 seconds for each SSH connection. VMs that have just booted
# can be slow to answer on the host-only network.
timeout = 30

[ssh_connection]
# Fewer SSH round trips per task, so the playbook runs faster.
pipelining = True

# Try a failed SSH connection again, up to 5 times. On 2026-11-09 a run
# started right after "vagrant up" timed out on all three VMs.
retries = 5
