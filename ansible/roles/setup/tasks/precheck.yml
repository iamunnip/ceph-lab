# Read-only checks that the install stage runs again on every storage VM
# before it bootstraps the cluster or creates OSDs. So a staged run
# ("--tags install" alone) still checks host names, the network, the disks,
# Podman and cephadm (with cephadm check-host) as they are now, not as
# they were when the setup stage ran.
# Nothing here changes a VM. Loaded from site.yml with tasks_from.

- name: Check that the lab host names resolve
  ansible.builtin.include_tasks: hosts_check.yml

- name: Check the host-only network
  ansible.builtin.include_tasks: network.yml

- name: Check the Ceph disks (never wipes them)
  ansible.builtin.include_tasks: disks.yml
  when: inventory_hostname in groups['ceph_osd']

- name: Check the Podman version
  ansible.builtin.include_tasks: podman_check.yml
  when: ceph_install_method == 'podman'

- name: Check the pinned cephadm and cephadm check-host on the admin hosts
  ansible.builtin.include_tasks: cephadm_check.yml
  when:
    - ceph_install_method == 'podman'
    - inventory_hostname in groups['ceph_admin']
