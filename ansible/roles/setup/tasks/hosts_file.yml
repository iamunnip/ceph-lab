# Manual: deploy-vm-cluster.md, "Make the host names resolvable".
# Vagrant maps only each VM's own name. Ceph needs every host to resolve the
# others, or the dashboard gateway fails with
# 'host not found in upstream "node-01:8443"'.
#
# lineinfile adds a line only if that exact line is missing, so running
# this again, or after the manual step, adds nothing twice.

- name: Add the comment line that marks the lab entries in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "# ceph-lab hosts"

- name: Add every lab VM (from hosts.yml) to /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ hostvars[item].ansible_host }} {{ item }}"
  loop: "{{ groups['all'] }}"

- name: Look up the other storage VMs by name (getent hosts)
  ansible.builtin.command: getent hosts {{ item }}
  loop: "{{ groups['ceph'] | difference([inventory_hostname]) }}"
  register: setup_getent
  changed_when: false

- name: Stop if a name does not resolve to its host-only address
  ansible.builtin.assert:
    that:
      - item.stdout.split()[0] == hostvars[item.item].ansible_host
    fail_msg: "{{ item.item }} resolves to '{{ item.stdout }}', expected {{ hostvars[item.item].ansible_host }}."
    quiet: true
  loop: "{{ setup_getent.results }}"
  loop_control:
    label: "{{ item.item }}"
