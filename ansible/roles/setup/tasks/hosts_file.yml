# Manual: deploy-vm-cluster.md, "Make the host names resolvable".
# Vagrant maps only each VM's own name. Ceph needs every host to resolve the
# others, or the dashboard gateway fails with
# 'host not found in upstream "node-01:8443"'.
#
# The name check is in hosts_check.yml, so the install stage can run it
# again without changing /etc/hosts.
#
# lineinfile adds a line only if that exact line is missing, so running
# this again, or after the manual step, adds nothing twice.

- name: Add the comment line that marks the lab entries in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "# ceph-lab hosts"

- name: Add every lab VM (from hosts.yml) to /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ hostvars[item].ansible_host }} {{ item }}"
  loop: "{{ groups['all'] }}"

- name: Check that the lab host names resolve
  ansible.builtin.include_tasks: hosts_check.yml
