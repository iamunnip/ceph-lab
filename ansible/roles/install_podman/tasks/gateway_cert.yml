# Manual: dashboard.md, "Give the gateways one certificate for all three addresses".
# cephadm's own gateway certificate covers only the first gateway host.
# This replaces it with one that names every gateway host and address.
#
# A new certificate is made when any gateway serves one that is missing,
# has another common name, expires within ceph_gateway_cert_min_days, lacks
# a gateway name or address, or differs from the others. Afterwards every
# gateway must serve the new certificate, and all checks must pass.

- name: Read and check the certificate every gateway serves now
  ansible.builtin.include_tasks: gateway_cert_read.yml

- name: Make and store the shared gateway certificate
  when: install_gateway_cert_state.problems | length > 0
  block:
    - name: Create a working folder only root can open
      ansible.builtin.file:
        path: "{{ ceph_gateway_cert_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Create a self-signed certificate and key for every gateway name and address (openssl req)
      ansible.builtin.command: >-
        openssl req -x509 -newkey rsa:{{ ceph_gateway_cert_key_bits }} -sha256
        -days {{ ceph_gateway_cert_days }} -nodes
        -keyout {{ ceph_gateway_cert_dir }}/gw.key
        -out {{ ceph_gateway_cert_dir }}/gw.crt
        -subj /CN={{ ceph_gateway_cert_cn }}
        -addext subjectAltName={{ ceph_gateway_cert_san }}
      changed_when: true

    - name: Keep the new certificate to compare with what the gateways serve (it is public)
      ansible.builtin.slurp:
        src: "{{ ceph_gateway_cert_dir }}/gw.crt"
      register: install_gateway_new_cert

    - name: Store the certificate in cephadm's cert store (ceph orch certmgr cert set)
      ansible.builtin.command: >-
        {{ cephadm_path }} shell --mount {{ ceph_gateway_cert_dir }}:/c --
        ceph orch certmgr cert set mgmt_gw_cert -i /c/gw.crt
      changed_when: true

    - name: Store the key in cephadm's cert store (ceph orch certmgr key set)
      ansible.builtin.command: >-
        {{ cephadm_path }} shell --mount {{ ceph_gateway_cert_dir }}:/c --
        ceph orch certmgr key set mgmt_gw_key -i /c/gw.key
      changed_when: true

    - name: Remove the working folder, the cert store keeps both files
      ansible.builtin.file:
        path: "{{ ceph_gateway_cert_dir }}"
        state: absent

    - name: Write the new files to every gateway (ceph orch reconfig mgmt-gateway)
      ansible.builtin.command: "{{ cephadm_path }} shell -- ceph orch reconfig mgmt-gateway"
      changed_when: true

    - name: Restart the gateways so nginx loads the new certificate (ceph orch restart mgmt-gateway)
      ansible.builtin.command: "{{ cephadm_path }} shell -- ceph orch restart mgmt-gateway"
      changed_when: true

    - name: Wait until every gateway serves the new certificate, can take minutes (openssl s_client)
      ansible.builtin.command:
        cmd: openssl s_client -connect {{ hostvars[item].ansible_host }}:{{ ceph_gateway_port }}
        stdin: ""
      loop: "{{ groups['ceph_gateway'] }}"
      register: install_gateway_check
      changed_when: false
      failed_when: false
      until: >-
        (install_gateway_check.stdout
        | regex_search('-----BEGIN CERTIFICATE-----[\s\S]*?-----END CERTIFICATE-----')
        | default('', true) | trim)
        == (install_gateway_new_cert.content | b64decode | trim)
      retries: "{{ ceph_wait_retries }}"
      delay: "{{ ceph_wait_delay }}"

- name: Read and check the certificate every gateway serves after the change
  ansible.builtin.include_tasks: gateway_cert_read.yml

- name: Stop if a gateway certificate is missing, expiring, wrongly named, incomplete or not shared
  ansible.builtin.assert:
    that:
      - install_gateway_cert_state.problems | length == 0
    fail_msg: "Gateway certificate problems: {{ install_gateway_cert_state.problems | join('; ') }}"
    success_msg: >-
      All {{ groups['ceph_gateway'] | length }} gateways serve one certificate
      ({{ install_gateway_cert_state.fingerprints | first }}), CN={{ ceph_gateway_cert_cn }},
      valid for at least {{ ceph_gateway_cert_min_days }} more days, covering
      {{ ceph_gateway_cert_expected_san | join(', ') }}.
