# Replace clusterID and monitor addresses before installing.
csiConfig:
  - clusterID: REPLACE_WITH_CEPH_FSID
    monitors:
      - 192.168.56.11:3300
      - 192.168.56.12:3300
      - 192.168.56.13:3300
kubeletDir: /var/lib/kubelet
driverName: rbd.csi.ceph.com
logLevel: 0
nodeplugin:
  updateStrategy: OnDelete
provisioner:
  replicaCount: 1
storageClass:
  create: false
secret:
  create: false
